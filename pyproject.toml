[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envguard"
version = "0.1.0"
description = "Check .env files against .env.example without ever printing secret values."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nikhil Kadalge" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[project.scripts]
envguard = "envguard.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/envguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
